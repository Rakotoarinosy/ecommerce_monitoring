<div class="logs container-fluid px-2 px-sm-3 px-lg-4 py-3">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div>
      <h1 class="h4 fw-bold text-dark mb-1">
        <i class="fas fa-file-alt text-muted me-2 fs-5"></i>
        Logs en temps réel
      </h1>
      <p class="text-muted small mb-0">
        Derniers événements de l'API (paiements, passerelle, erreurs), rafraîchis chaque seconde.
      </p>
    </div>
    <span class="live-pill" [class.off]="!connected">
      <span class="live-dot"></span>{{ connected ? 'En direct' : 'Connexion…' }}
    </span>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3">
    <button type="button" class="btn btn-sm rounded-pill px-3"
            [ngClass]="level === '' ? 'btn-dark' : 'btn-light border'" (click)="level = ''">Tous</button>
    <button type="button" class="btn btn-sm rounded-pill px-3 text-capitalize" *ngFor="let item of levels"
            [ngClass]="level === item ? 'btn-dark' : 'btn-light border'" (click)="level = item">{{ item }}</button>
  </div>

  <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
    <div class="list-group list-group-flush">
      <div class="list-group-item text-center text-muted py-5" *ngIf="!visible.length">
        <i class="fas fa-stream fs-2 mb-3 d-block opacity-25"></i>
        Aucun log pour le moment.
      </div>
      <div class="list-group-item px-4 py-3 d-flex gap-3 align-items-start" *ngFor="let log of visible">
        <span class="badge rounded-pill text-uppercase level"
              [ngClass]="'bg-' + tone(log.level) + '-subtle text-' + tone(log.level)">{{ normalize(log.level) }}</span>
        <div class="flex-grow-1 small text-dark message">{{ log.message }}</div>
        <span class="small text-muted text-nowrap">{{ log.timestamp | date:'d MMM, HH:mm:ss' }}</span>
      </div>
    </div>
  </div>
</div>
